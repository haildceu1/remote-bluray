[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-bluray"
version = "0.1.1"
description = "Extract Blu-ray playlists and audio from remote ISO/STRM sources over HTTP Range requests"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
]
authors = [
    { name = "Tron" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: Microsoft :: Windows",
]

[project.scripts]
remote-bluray = "remote_bluray:main"

[tool.setuptools]
py-modules = ["remote_bluray"]
